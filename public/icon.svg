<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Golden Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Aircraft Metal Gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Flight Trail Gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002B7F" stop-opacity="0" />
      <stop offset="30%" stop-color="#002B7F" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#AA151B" stop-opacity="1" />
    </linearGradient>

    <!-- Clip Path for Costa Rica Flag Badge (Left Circle) -->
    <clipPath id="crClip">
      <circle cx="140" cy="370" r="60" />
    </clipPath>

    <!-- Clip Path for Spain Flag Badge (Right Circle) -->
    <clipPath id="esClip">
      <circle cx="372" cy="142" r="60" />
    </clipPath>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring / Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Flight Path Arc Connecting CR to ES -->
  <path d="M 140 370 Q 220 220 372 142" fill="none" stroke="url(#trailGrad)" stroke-width="8" stroke-dasharray="12 8" stroke-linecap="round" />

  <!-- Costa Rica Flag Badge (Origin: Left-Bottom) -->
  <g filter="url(#shadow)">
    <!-- Golden Border Ring -->
    <circle cx="140" cy="370" r="64" fill="none" stroke="#fbbf24" stroke-width="5" />
    <!-- Flag Stripes -->
    <g clip-path="url(#crClip)">
      <!-- Blue top -->
      <rect x="70" y="300" width="140" height="24" fill="#002B7F" />
      <!-- White stripe 1 -->
      <rect x="70" y="324" width="140" height="24" fill="#FFFFFF" />
      <!-- Red center (double) -->
      <rect x="70" y="348" width="140" height="44" fill="#CE1126" />
      <!-- White stripe 2 -->
      <rect x="70" y="392" width="140" height="24" fill="#FFFFFF" />
      <!-- Blue bottom -->
      <rect x="70" y="416" width="140" height="24" fill="#002B7F" />
    </g>
    <!-- Label CR -->
    <rect x="110" y="408" width="60" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#ffffff" stroke-width="1.5" />
    <text x="140" y="422" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" letter-spacing="1">CR 🇨🇷</text>
  </g>

  <!-- Spain Flag Badge (Destination: Right-Top) -->
  <g filter="url(#shadow)">
    <!-- Golden Border Ring -->
    <circle cx="372" cy="142" r="64" fill="none" stroke="#fbbf24" stroke-width="5" />
    <!-- Flag Stripes -->
    <g clip-path="url(#esClip)">
      <!-- Red top -->
      <rect x="300" y="70" width="140" height="36" fill="#AA151B" />
      <!-- Yellow center (double) -->
      <rect x="300" y="106" width="140" height="72" fill="#F1BF00" />
      <!-- Red bottom -->
      <rect x="300" y="178" width="140" height="36" fill="#AA151B" />
    </g>
    <!-- Label ES -->
    <rect x="342" y="180" width="60" height="20" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#ffffff" stroke-width="1.5" />
    <text x="372" y="194" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" letter-spacing="1">ES 🇪🇸</text>
  </g>

  <!-- Elegant Dynamic Airplane in Center flying towards Spain -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#shadow)">
    <!-- Wing contrails / speed streaks -->
    <line x1="200" y1="360" x2="200" y2="440" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="312" y1="360" x2="312" y2="440" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Airplane Body & Wings Shadow/Underlayer -->
    <!-- Main Fuselage -->
    <path d="M 256 120 
             C 266 140, 274 200, 274 320 
             L 282 390 
             L 256 405 
             L 230 390 
             L 238 320 
             C 238 200, 246 140, 256 120 Z" 
          fill="url(#planeGrad)" stroke="#64748b" stroke-width="2" />

    <!-- Cockpit Glass -->
    <path d="M 256 140 
             C 261 152, 263 170, 263 185 
             L 249 185 
             C 249 170, 251 152, 256 140 Z" 
          fill="#0284c7" />

    <!-- Main Wings -->
    <!-- Left Wing (CR Colors Accent) -->
    <path d="M 242 240 
             L 100 330 
             L 95 350 
             L 240 300 Z" 
          fill="url(#planeGrad)" stroke="#64748b" stroke-width="2" />
    <!-- Left Wing Winglet with CR Blue/Red touch -->
    <path d="M 95 332 L 85 315 L 98 348 Z" fill="#002B7F" />
    <path d="M 98 348 L 88 335 L 100 350 Z" fill="#CE1126" />

    <!-- Right Wing (ES Colors Accent) -->
    <path d="M 270 240 
             L 412 330 
             L 417 350 
             L 272 300 Z" 
          fill="url(#planeGrad)" stroke="#64748b" stroke-width="2" />
    <!-- Right Wing Winglet with ES Red/Yellow touch -->
    <path d="M 417 332 L 427 315 L 414 348 Z" fill="#AA151B" />
    <path d="M 414 348 L 424 335 L 412 350 Z" fill="#F1BF00" />

    <!-- Jet Engines -->
    <rect x="185" y="280" width="16" height="36" rx="8" fill="#475569" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="311" y="280" width="16" height="36" rx="8" fill="#475569" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Tail Wings (Horizontal Stabilizers) -->
    <path d="M 244 375 L 175 410 L 172 422 L 246 400 Z" fill="url(#planeGrad)" stroke="#64748b" stroke-width="1.5" />
    <path d="M 268 375 L 337 410 L 340 422 L 266 400 Z" fill="url(#planeGrad)" stroke="#64748b" stroke-width="1.5" />

    <!-- Vertical Tail Fin -->
    <path d="M 256 335 L 260 405 L 252 405 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Sparkles / Stars -->
  <circle cx="210" cy="130" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="300" cy="90" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="430" cy="270" r="3" fill="#fbbf24" opacity="0.7" />
  <circle cx="90" cy="250" r="2.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="270" cy="450" r="3" fill="#ffffff" opacity="0.8" />

  <!-- Bottom Brand Banner -->
  <g transform="translate(256, 465)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" fill-opacity="0.95" stroke="#f59e0b" stroke-width="2" />
    <text x="0" y="6" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="1.5">
      ESPAÑA 2026 • PWA
    </text>
  </g>
</svg>
